name: Error
description: Algo que no se mueve como debería.
title: "[Error] "
labels: ["tipo: error", "estado: por hacer"]
body:
  - type: textarea
    id: pasa
    attributes:
      label: Qué pasa
      placeholder: "Al volver hacia arriba desde el cierre, el panel se queda girado y no vuelve a su sitio."
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: Si puedes, añade el capítulo y el tiempo del maestro que muestra ?debug.
      placeholder: |
        1. Abrir demo.yoiber.com/?debug y bajar hasta el final.
        2. Subir de golpe con la barra de progreso.
        3. En COMO el panel se queda inclinado. Maestro en 15200.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador y dispositivo
      placeholder: "Safari en iPhone 13, o Firefox 145 en escritorio"
    validations:
      required: true
  - type: dropdown
    id: movimiento
    attributes:
      label: ¿Tenías activado el movimiento reducido?
      options:
        - "No"
        - "Sí"
        - No lo sé
      default: 0
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - Alta
        - Media
        - Baja
      default: 1
