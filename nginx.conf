# Cabeceras de seguridad. Van también en /assets/ porque add_header en un
# location anula las del bloque server.
map $sent_http_content_type $csp {
    default "";
    ~text/html "default-src 'self'; script-src 'self' 'sha256-5+QwNFz0I0xqv5eV1EE+Am/Hge9uDuaetw44Lpf2a0A='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}

# Al ensayo se le dice que no se indexe; a la web de verdad, nada.
map $host $robots {
    default "";
    ~^demo\. "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # El ensayo (demo.yoiber.com) sirve EL MISMO HTML que yoiber.com. La canónica del documento
    # ya apunta a yoiber.com, y esta cabecera lo remata: al ensayo no se le indexa, y así no
    # compite contra la web de verdad por las mismas palabras.
    location / {
        add_header X-Robots-Tag $robots always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
        # `=404` y NO `/index.html`. Esta web no tiene rutas de cliente, solo anclas, así que el
        # respaldo a la portada no servía para nada Y rompía dos cosas: /robots.txt y /sitemap.xml
        # devolvían la portada con código 200 (o sea, no existían para Google), y cualquier ruta
        # inventada respondía 200 en vez de 404, que es lo que Google llama un "404 blando" y le
        # hace indexar direcciones basura. Comprobado el 2026-09-10 con curl antes de cambiarlo.
        try_files $uri $uri/ =404;
    }
}
